apiVersion: v1
kind: ConfigMap
metadata:
  name: dustin-scan-config
  namespace: dustin-scan
data:
  # Node 환경
  NODE_ENV: 'production'

  # 포트 설정
  API_PORT: '4000'
  INDEXER_PORT: '4001'
  SYNC_PORT: '4002'

  # 데이터베이스 설정 (호스트와 비밀번호는 Secret에서 관리)
  DB_PORT: '5432'
  DB_USERNAME: 'root'
  DB_SYNCHRONIZE: 'false'

  # Chain RPC URL은 Secret에서 관리 (보안상 민감한 정보)
  # 실제 값은 환경별 Secret에서 설정

  # Indexer Service URL (같은 네임스페이스 내 서비스 이름 사용)
  INDEXER_URL: 'http://prod-indexer-service:4001'

  # Healthcheck 포트
  HEALTHCHECK_PORT: '4000'
