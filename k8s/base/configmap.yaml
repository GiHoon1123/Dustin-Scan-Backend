apiVersion: v1
kind: ConfigMap
metadata:
  name: dustin-scan-config
  namespace: dustin-scan
data:
  # Node 환경
  NODE_ENV: 'production'

  # 포트 설정
  API_PORT: '4000'
  INDEXER_PORT: '4001'
  SYNC_PORT: '4002'

  # 데이터베이스 설정 (호스트와 비밀번호는 Secret에서 관리)
  DB_PORT: '5432'
  DB_USERNAME: 'root'
  DB_SYNCHRONIZE: 'false'

  # Chain RPC URL (도커 컨테이너로 실행 중인 Dustin-Chain에 접근)
  # 코어 서버 공인 IP로 접근 (같은 인스턴스에 있지만 Pod에서 호스트 접근을 위해 공인 IP 사용)
  CHAIN_URL: 'http://3.39.148.232:3000'

  # Indexer Service URL (같은 네임스페이스 내 서비스 이름 사용)
  INDEXER_URL: 'http://prod-indexer-service:4001'

  # Healthcheck 포트
  HEALTHCHECK_PORT: '4000'
